name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write 
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create placeholder .env file
        working-directory: ./desktop
        shell: bash
        run: |
          echo "NEXT_PUBLIC_BACKEND_URL=https://mac-in-wind.onrender.com" > .env
          echo "NEXT_PUBLIC_DESKTOP_CALLBACK_URL=https://macinair.bishal.online/desktop-callback" >> .env
          echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=488531878241-tfoqda9qpv49qrctn7shap2os19696mf.apps.googleusercontent.com" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
 

      - name: Install dependencies
        working-directory: ./desktop
        run: npm install

      - name: Build and release
        working-directory: ./desktop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run release