name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./web
        run: npm ci

      - name: TypeScript Build
        working-directory: ./web/backend
        run: npm run build

      - name: Run Tests
        working-directory: ./web/backend
        run: npm test
