appId: com.electron.nextjs-app
productName: MAC in WIND
copyright: Copyright © 2026 Bishal Kandi

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - package.json
  - "!dist/**/*.map"
  - "!node_modules/**/*"

extraMetadata:
  main: dist/electron/main/main.js

mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  artifactName: "${productName}-${version}-mac.${ext}"
  category: public.app-category.developer-tools

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: "${productName}-${version}-win.${ext}"

linux:
  target:
    - target: AppImage
      arch: [x64]
  artifactName: "${productName}-${version}-linux.${ext}"
  category: Development

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
