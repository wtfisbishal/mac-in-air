appId: com.bisxxal.mac-in-air
productName: MAC in AIR
copyright: Copyright © 2026 Bishal Kandi

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - package.json
  - "!dist/**/*.map"
  - "!node_modules/**/*"

extraMetadata:
  main: dist/electron/main/main.js

mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  artifactName: "${productName}-${version}-mac.${ext}"
  category: public.app-category.developer-tools
   
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
