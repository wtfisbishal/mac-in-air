global:
  scrape_interval: 10s

 

scrape_configs:
  - job_name: 'backend-local'
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['172.20.10.8:4000' ]

  - job_name: 'backend-render'
    metrics_path: '/metrics'
    scheme: https
    static_configs:
      - targets: [ 'mac-in-wind.onrender.com']